<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BOSS AI 求职助手 · 本地面板预览</title>
<style>body{font:16px/1.8 system-ui;background:#f1f7f7;color:#183544;padding:6vh 6vw}h1{font-size:32px}article{max-width:660px;background:white;border:1px solid #d9e6e8;border-radius:18px;padding:30px}p{color:#48616e}code{background:#e8f4f2;padding:3px 7px;border-radius:4px}</style>
<article><h1>AI 求职助手</h1><p>本地配置面板预览。点击右下角的「AI 求职助手」打开面板。</p><p>默认筛选 <strong>北京 · 实习</strong>。每天定时运行，所有发送间隔至少 3 分钟，每轮独立随机等待 10–60 秒再刷新。</p><p>这里使用虚构职位演示筛选理由和招呼预览。<strong>此页面不连接 BOSS、不调用 AI、不发送消息。</strong> 请勿在演示页输入真实 Key 或简历。</p><p>正式使用请把 <code>dist/boss-ai.user.js</code> 安装到油猴，然后打开 BOSS 搜索页。</p></article>
<script>
const prefix='bossai.v1.';
const initial={task:null,lastSendAt:0,blockedWindow:'',outbox:[],logs:[],entries:{demo:{key:'demo',status:'review',note:'演示记录；未连接实际职位',job:{jobId:'demo',recruiterId:'demo',title:'前端开发实习生 · 北京',city:'北京',employmentType:'实习',url:'https://www.zhipin.com/web/geek/jobs'},analysis:{score:88,reason:'虚构示例：前端项目经验与岗位职责相关，每周实习时间仍需确认。',doubts:['需要确认每周出勤天数'],greeting:'您好，我正在寻找北京的前端实习，有相关项目经验，希望进一步了解岗位。'}}}};
const memory = new Map([[prefix+'state', initial]]);
window.GM_getValue=(k,d=null)=>structuredClone(memory.has(k)?memory.get(k):d);
window.GM_setValue=(k,v)=>memory.set(k,structuredClone(v));
window.GM_deleteValue=k=>memory.delete(k);
window.GM_listValues=()=>[...memory.keys()];
window.GM_registerMenuCommand=()=>{};
window.GM_openInTab=()=>{throw new Error('演示页不打开实际工作标签页')};
window.GM_xmlhttpRequest=()=>{throw new Error('演示页不调用 AI，请勿在此输入真实 Key')};
</script><script src="/userscript.js"></script></html>
